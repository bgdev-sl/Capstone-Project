[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ids-prototype"
version = "0.4.0"
description = "Prototype ML-based intrusion detection system for resource-constrained edge environments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "joblib>=1.3",
  "psutil>=5.9",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35"]
capture = ["scapy>=2.5"]
dev = ["pytest>=8.0", "httpx>=0.27"]
all = ["streamlit>=1.35", "scapy>=2.5", "pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
